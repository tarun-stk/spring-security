#we're saying to import below properties file
spring.config.import=application_prod.properties
spring.profiles.active=prod

spring.application.name=${SPRING_APP_NAME:stkbankbackend}
logging.level.org.springframework.security=${SPRING_SECURITY_LOG_LEVEL:TRACE}

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:stkbank}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
#below shows sql statements that are getting executed by jpa
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
#below prints sql statements in more readable format which are getting printed from above line
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
